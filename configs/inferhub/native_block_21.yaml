runtime_mode: rag_sparse
denoising_step_list: [1000, 750, 500, 250]
warp_denoising_step: true
num_frame_per_block: 3
model_name: Wan2.1-T2V-1.3B
model_kwargs:
  local_attn_size: 12
  timestep_shift: 5.0
  sink_size: 3
  memory_size: 0
  recent_exclude: 0
  use_latentmem: true
  compression_method: avg_pool
sparse_history:
  method: block64_history
  backend: grouped_fa2
  history_density: 0.25
  recent_exact_frames: 3
data_path: configs/prompts/smoke.txt
output_folder: ${oc.env:INFER_OUTPUT_DIR}
inference_iter: 0
num_output_frames: 21
use_ema: false
seed: 20260826
num_samples: 1
save_with_index: true
global_sink: true
context_noise: 0
profile: true
generator_ckpt: ${oc.env:LONGLIVE_GENERATOR_CKPT}
lora_ckpt: ${oc.env:LONGLIVE_LORA_CKPT}
adapter: {type: lora, rank: 256, alpha: 256, dropout: 0.0, dtype: bfloat16, verbose: false}

